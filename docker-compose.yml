# ============================================
# MassMutual Financial Pipeline — Docker Compose
# ============================================
# Architecture:
#   Data Plane:  Kafka → Spark Streaming → PostgreSQL + Redis
#   Batch Plane: Airflow → Spark ETL → PostgreSQL (Star Schema)
#   AI Plane:    Flask + Gemini API → Natural Language SQL
#   Frontend:    Flask + WebSocket → Dashboard
# ============================================

# NOTE: 'version' key is deprecated in Docker Compose v2+ and removed here.

services:

  # ============================================
  # PostgreSQL — Application Database
  # ============================================
  postgres:
    image: postgres:15
    container_name: mm_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_create_db.sql:/docker-entrypoint-initdb.d/01_create_db.sql
      - ./db/02_create_tables.sh:/docker-entrypoint-initdb.d/02_create_tables.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - data-plane
      - front-plane
    restart: unless-stopped

  # ============================================
  # PostgreSQL — Airflow Metadata (Separate Instance)
  # ============================================
  postgres-airflow:
    image: postgres:15
    container_name: mm_postgres_airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow_meta}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - data-plane
    restart: unless-stopped

  # ============================================
  # Redis — Caching Layer
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: mm_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-massmutual_redis}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-massmutual_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - data-plane
      - front-plane
    restart: unless-stopped

  # ============================================
  # Kafka (KRaft Mode — No Zookeeper)
  # ============================================
  kafka:
    image: bitnamilegacy/kafka:3.9.0
    container_name: mm_kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - data-plane
    restart: unless-stopped

  # ============================================
  # Spark Master
  # ============================================
  spark-master:
    image: bitnamilegacy/spark:3.5.0
    container_name: mm_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8081
      - SPARK_MASTER_OPTS=-Dspark.master.rest.enabled=true
    ports:
      - "8081:8081"
      - "7077:7077"
    volumes:
      - ./data:/data:ro
      - ./spark:/app
      - ./jars:/opt/spark/jars:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - data-plane
    restart: unless-stopped

  # ============================================
  # Spark Worker
  # ============================================
  spark-worker:
    image: bitnamilegacy/spark:3.5.0
    container_name: mm_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - POSTGRES_HOST=postgres
      - APP_DB_NAME=${APP_DB_NAME:-massmutual}
      - APP_DB_USER=${APP_DB_USER:-massmutual}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-massmutual123}
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-market-data}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-massmutual_redis}
      - CHECKPOINT_DIR=/app/checkpoints
    depends_on:
      spark-master:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
      - ./spark:/app
      - ./jars:/opt/spark/jars:ro
      - spark_checkpoints:/app/checkpoints
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
    networks:
      - data-plane
    restart: unless-stopped

  # ============================================
  # Airflow (Webserver + Scheduler)
  # ============================================
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: mm_airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow_meta}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=False
      - AIRFLOW__CORE__FERNET_KEY=81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaXe0yb8=
      - APP_DB_NAME=${APP_DB_NAME:-massmutual}
      - APP_DB_USER=${APP_DB_USER:-massmutual}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-massmutual123}
      - POSTGRES_HOST=postgres
      - SPARK_HOME=/opt/spark
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data:ro
      - ./data:/data:ro
      - ./jars:/opt/spark-extra-jars:ro
      - ./spark:/app:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres-airflow:
        condition: service_healthy
      spark-master:
        condition: service_started
    entrypoint: ["/entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - data-plane
    restart: unless-stopped

  # ============================================
  # Market Data Producer (Streaming)
  # ============================================
  market-producer:
    build:
      context: ./streaming
      dockerfile: Dockerfile
    container_name: mm_producer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-market-data}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - TICKERS=${TICKERS:-1155.KL,BINANCE:BTCUSDT}
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - data-plane
    restart: unless-stopped

  # ============================================
  # Frontend Dashboard + API
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mm_frontend
    environment:
      - POSTGRES_HOST=postgres
      - APP_DB_NAME=${APP_DB_NAME:-massmutual}
      - APP_DB_USER=${APP_DB_USER:-massmutual}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-massmutual123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-massmutual_redis}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-dev_secret_key_change_in_production}
      - TICKERS=${TICKERS:-1155.KL,BINANCE:BTCUSDT}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - front-plane
    restart: unless-stopped

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  postgres_airflow_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  spark_checkpoints:
    driver: local
  airflow_logs:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  data-plane:
    driver: bridge
    name: mm_data_plane
  front-plane:
    driver: bridge
    name: mm_front_plane
